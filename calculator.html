<!DOCTYPE html>
<html lang="en">
<head>
  <title>Calculator — Interesting Stuff</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, accessible calculator">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #0f0f13;
      --surface:   #1a1a22;
      --surface2:  #22222e;
      --border:    #2e2e3e;
      --accent:    #c8ff3e;
      --accent2:   #ff6b6b;
      --op-color:  #a78bfa;
      --text:      #f0f0f5;
      --text-muted:#7b7b96;
      --radius:    18px;
      --shadow:    0 8px 40px rgba(0,0,0,0.5);
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(200,255,62,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 10% 90%, rgba(167,139,250,0.07) 0%, transparent 60%);
      font-family: 'Syne', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 60px;
    }

    /* ── Skip link ── */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 0;
      background: var(--accent);
      color: #000;
      padding: 8px 16px;
      font-weight: 700;
      z-index: 999;
      border-radius: 0 0 8px 0;
    }
    .skip-link:focus { top: 0; }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 720px;
      padding: 28px 0 12px;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    h1 span { color: var(--accent); }

    /* ── Nav ── */
    nav {
      width: 100%;
      max-width: 720px;
      margin-bottom: 32px;
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 0 0;
      border-top: 1px solid var(--border);
    }

    nav a {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      letter-spacing: 0.02em;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    nav a:hover, nav a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
      background: rgba(200,255,62,0.06);
    }
    nav a[aria-current="page"] {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 500;
    }

    /* ── Calculator shell ── */
    main {
      width: 100%;
      max-width: 380px;
    }

    .calc {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
    }

    /* ── Display ── */
    .display-wrap {
      padding: 24px 24px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .display-expr {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      min-height: 1.2em;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    #display {
      display: block;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'DM Mono', monospace;
      font-size: clamp(2rem, 8vw, 2.6rem);
      font-weight: 500;
      color: var(--text);
      text-align: right;
      letter-spacing: -0.02em;
      caret-color: var(--accent);
      /* readonly styled but still readable */
    }
    #display::selection { background: rgba(200,255,62,0.2); }

    /* Live region for screen readers */
    #sr-live {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }

    /* ── Button grid ── */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      padding: 0;
    }

    /* Each cell background */
    button {
      all: unset;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      height: 72px;
      font-family: 'DM Mono', monospace;
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, transform 0.08s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    /* Ripple */
    button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      border-radius: inherit;
      transition: opacity 0.3s;
    }
    button:active::after { opacity: 0.06; }
    button:active { transform: scale(0.95); }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      z-index: 1;
    }

    /* Operators */
    button.op {
      color: var(--op-color);
      font-size: 1.2rem;
    }
    button.op:hover, button.op:focus-visible { background: rgba(167,139,250,0.12); }

    /* Equals */
    button.eq {
      background: var(--accent);
      color: #000;
      font-weight: 500;
      font-size: 1.2rem;
    }
    button.eq:hover { background: #d8ff5a; }
    button.eq:focus-visible {
      outline-color: #fff;
      background: #d8ff5a;
    }
    button.eq:active { transform: scale(0.94); }

    /* Clear */
    button.clr {
      color: var(--accent2);
    }
    button.clr:hover, button.clr:focus-visible { background: rgba(255,107,107,0.1); }

    /* Backspace (spans 1) */
    button.bksp {
      color: var(--accent2);
      font-size: 1.1rem;
    }
    button.bksp:hover, button.bksp:focus-visible { background: rgba(255,107,107,0.1); }

    /* Number hover */
    button.num:hover, button.num:focus-visible {
      background: var(--surface2);
    }

    /* Wide zero button */
    button.zero {
      grid-column: span 2;
    }

    /* ── Error shake ── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-6px); }
      40%     { transform: translateX(6px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }
    .display-wrap.error { animation: shake 0.35s ease; }
    .display-wrap.error #display { color: var(--accent2); }

    /* ── Footer ── */
    footer {
      margin-top: 28px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.04em;
      text-align: center;
    }
  </style>
</head>
<body>

<a class="skip-link" href="#calc-buttons">Skip to calculator buttons</a>
<span id="sr-live" aria-live="polite" aria-atomic="true"></span>

<header>
  <h1>Interesting <span>Stuff</span></h1>
</header>

<nav aria-label="Site navigation">
  <ul>
    <li><a href="index.html">Main</a></li>
    <li><a href="photos.html">Photos</a></li>
    <li><a href="drawing.html">Drawing</a></li>
    <li><a href="calculator.html" aria-current="page">Calculator</a></li>
    <li><a href="cities.html">Cities of the world</a></li>
  </ul>
</nav>

<main>
  <section class="calc" aria-label="Calculator">

    <div class="display-wrap" id="display-wrap">
      <div class="display-expr" id="display-expr" aria-hidden="true"></div>
      <input
        type="text"
        id="display"
        role="textbox"
        aria-label="Calculator display"
        aria-readonly="true"
        readonly
        value="0"
      />
    </div>

    <div class="btn-grid" id="calc-buttons" role="group" aria-label="Calculator buttons">

      <!-- Row 1 -->
      <button class="clr" onclick="pressClear()" aria-label="Clear all">AC</button>
      <button class="bksp" onclick="pressBack()" aria-label="Backspace">⌫</button>
      <button class="op"   onclick="pressOp('%')" aria-label="Percent">%</button>
      <button class="op"   onclick="pressOp('/')" aria-label="Divide">÷</button>

      <!-- Row 2 -->
      <button class="num" onclick="pressNum('7')" aria-label="7">7</button>
      <button class="num" onclick="pressNum('8')" aria-label="8">8</button>
      <button class="num" onclick="pressNum('9')" aria-label="9">9</button>
      <button class="op"  onclick="pressOp('*')" aria-label="Multiply">×</button>

      <!-- Row 3 -->
      <button class="num" onclick="pressNum('4')" aria-label="4">4</button>
      <button class="num" onclick="pressNum('5')" aria-label="5">5</button>
      <button class="num" onclick="pressNum('6')" aria-label="6">6</button>
      <button class="op"  onclick="pressOp('-')" aria-label="Subtract">−</button>

      <!-- Row 4 -->
      <button class="num" onclick="pressNum('1')" aria-label="1">1</button>
      <button class="num" onclick="pressNum('2')" aria-label="2">2</button>
      <button class="num" onclick="pressNum('3')" aria-label="3">3</button>
      <button class="op"  onclick="pressOp('+')" aria-label="Add">+</button>

      <!-- Row 5 -->
      <button class="num zero" onclick="pressNum('0')" aria-label="0">0</button>
      <button class="num"      onclick="pressDecimal()" aria-label="Decimal point">.</button>
      <button class="eq"       onclick="pressEquals()" aria-label="Equals">=</button>

    </div>
  </section>
</main>

<footer aria-label="Keyboard shortcut tip">
  Keyboard supported · Type numbers and operators directly
</footer>

<script>
  (function () {
    /* ── State ── */
    let current   = '0';   // what's shown
    let operator  = null;  // pending operator
    let previous  = null;  // left-hand operand
    let freshResult = false; // last action was =

    const display  = document.getElementById('display');
    const exprEl   = document.getElementById('display-expr');
    const wrap     = document.getElementById('display-wrap');
    const srLive   = document.getElementById('sr-live');

    /* ── Helpers ── */
    function setDisplay(val) {
      // Limit length to avoid overflow
      const s = String(val);
      display.value = s.length > 14 ? parseFloat(val).toExponential(6) : s;
    }

    function announce(msg) {
      srLive.textContent = '';
      requestAnimationFrame(() => { srLive.textContent = msg; });
    }

    function showError(msg) {
      display.value = msg;
      exprEl.textContent = '';
      wrap.classList.add('error');
      wrap.addEventListener('animationend', () => wrap.classList.remove('error'), { once: true });
      announce('Error: ' + msg);
      reset();
    }

    function reset() {
      current   = '0';
      operator  = null;
      previous  = null;
      freshResult = false;
    }

    function updateExpr() {
      if (previous !== null && operator) {
        const opSymbol = {'+':'+', '-':'−', '*':'×', '/':'÷', '%':'%'}[operator] || operator;
        exprEl.textContent = previous + ' ' + opSymbol;
      } else {
        exprEl.textContent = '';
      }
    }

    /* ── Button actions ── */
    function pressNum(n) {
      if (freshResult) { current = '0'; freshResult = false; }
      if (current === '0' && n !== '.') {
        current = n;
      } else {
        if (current.length >= 14) return;
        current += n;
      }
      setDisplay(current);
      updateExpr();
    }

    function pressDecimal() {
      if (freshResult) { current = '0'; freshResult = false; }
      if (!current.includes('.')) {
        current += '.';
        setDisplay(current);
      }
    }

    function pressOp(op) {
      freshResult = false;
      if (previous !== null && operator) {
        // chain calculation
        const result = compute(parseFloat(previous), parseFloat(current), operator);
        if (result === null) return;
        previous = String(result);
        setDisplay(result);
        current = String(result);
      } else {
        previous = current;
      }
      operator = op;
      current  = '0';
      updateExpr();
      announce(display.value + ' ' + op);
    }

    function pressEquals() {
      if (!operator || previous === null) return;
      const a = parseFloat(previous);
      const b = parseFloat(current);
      const result = compute(a, b, operator);
      if (result === null) return;
      const opSymbol = {'+':'+', '-':'−', '*':'×', '/':'÷', '%':'%'}[operator] || operator;
      exprEl.textContent = previous + ' ' + opSymbol + ' ' + current + ' =';
      current  = String(result);
      operator = null;
      previous = null;
      freshResult = true;
      setDisplay(result);
      announce('Result: ' + result);
    }

    function compute(a, b, op) {
      let r;
      if (op === '+') r = a + b;
      else if (op === '-') r = a - b;
      else if (op === '*') r = a * b;
      else if (op === '/') {
        if (b === 0) { showError("Can't ÷ 0"); return null; }
        r = a / b;
      } else if (op === '%') {
        r = a % b;
      }
      // Guard against floating-point junk
      return parseFloat(r.toPrecision(12));
    }

    function pressBack() {
      if (freshResult) return;
      if (current.length <= 1) {
        current = '0';
      } else {
        current = current.slice(0, -1);
      }
      setDisplay(current);
      updateExpr();
    }

    function pressClear() {
      reset();
      setDisplay('0');
      exprEl.textContent = '';
      announce('Cleared');
    }

    /* Expose to onclick handlers */
    window.pressNum     = pressNum;
    window.pressOp      = pressOp;
    window.pressEquals  = pressEquals;
    window.pressDecimal = pressDecimal;
    window.pressBack    = pressBack;
    window.pressClear   = pressClear;

    /* ── Keyboard support ── */
    document.addEventListener('keydown', function (e) {
      // Don't hijack when focus is on a link
      if (e.target.tagName === 'A') return;

      if (e.key >= '0' && e.key <= '9') pressNum(e.key);
      else if (e.key === '+') pressOp('+');
      else if (e.key === '-') pressOp('-');
      else if (e.key === '*') pressOp('*');
      else if (e.key === '/') { e.preventDefault(); pressOp('/'); }
      else if (e.key === '%') pressOp('%');
      else if (e.key === '.' || e.key === ',') pressDecimal();
      else if (e.key === 'Enter' || e.key === '=') pressEquals();
      else if (e.key === 'Backspace') pressBack();
      else if (e.key === 'Escape' || e.key === 'Delete') pressClear();
    });

    /* ── Init ── */
    setDisplay('0');
  })();
</script>

</body>
</html>
